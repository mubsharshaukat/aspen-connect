<style>
/* Layout: ASPEN Desktop shell (title bar, toolbar, nav, MDI area, status bar) hosting the Connect window. Light only, like ASPEN. */
:root{
  --ai:#2e7d32; --ai-soft:#e9f5ea; --brand:#1e3a2b; --brand2:#2b4f3b; --paper:#fffdf8; --ease:cubic-bezier(.2,.8,.2,1);
  --accent:#0078d4; --accent-hover:#106ebe; --accent-press:#005a9e; --accent-soft:#deecf9; --sel:#e5f1fb;
  --fg:#201f1e; --fg2:#605e5c; --fg3:#8a8886; --line:#e1dfdd; --line2:#c8c6c4;
  --chrome:#f3f2f1; --chrome2:#faf9f8; --white:#ffffff; --hover:#f3f2f1; --mdi:#ffffff;
  --red:#c50f1f; --red-soft:#fde7e9; --green:#107c10; --green-soft:#dff6dd; --amber:#8a5300; --amber-bg:#fff4ce; --orange:#ca5010;
  --sales:#0063b1; --service:#008575; --parts:#ca5010; --cust:#d83b01; --units:#4a6274; --fav:#ffb900; --settings:#881798; --acct:#107c10;
  --p-on:#6bb700; --p-busy:#c4314b; --p-away:#ffaa44; --p-off:#8a8886;
  --font:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"Cascadia Mono","Courier New",monospace;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:#e9e8e7;color:var(--fg);font:13px/1.4 var(--font);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,textarea,select{font:inherit;color:var(--fg)}
svg.i{width:16px;height:16px;flex:none;display:block}
svg.i.s12{width:12px;height:12px} svg.i.s20{width:20px;height:20px} svg.i.s24{width:24px;height:24px}
#root{height:100%;overflow:auto}
.desk{height:100%;min-width:1180px;min-height:640px;display:flex;flex-direction:column;background:var(--white)}
/* ASPEN title bar + toolbar */
.wtitle{height:30px;display:flex;align-items:center;gap:8px;padding-left:8px;background:var(--white);font-size:12px;color:var(--fg2);flex:none}
.wtitle .logo{width:16px;height:16px;border-radius:3px;background:#3a9a3e;display:grid;place-items:center;color:#fff;font:700 10px/1 var(--font)}
.wtitle .grow{flex:1}
.wbtns{display:flex}.wbtns span{width:46px;height:30px;display:grid;place-items:center;color:var(--fg2)}
.atool{height:34px;display:flex;align-items:center;gap:2px;padding:0 6px;border-bottom:1px solid var(--line);background:var(--white);flex:none;font-size:12.5px}
.tb{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 7px;border-radius:3px;white-space:nowrap;position:relative}
.tb:hover{background:var(--hover)} .tb.on{background:var(--sel)}
.tsep{width:1px;height:18px;background:var(--line);margin:0 5px}
.toggle{width:34px;height:16px;border-radius:8px;border:1px solid var(--fg2);position:relative;display:inline-block}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--fg2)}
.toggle.on{background:var(--accent);border-color:var(--accent)} .toggle.on::after{left:21px;background:#fff}
.usearch{display:flex;align-items:center;border:1px solid var(--line2);height:22px;width:150px;padding:0 4px;margin-left:4px;background:#fff}
.badge{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font:600 10px/1 var(--font)}
.badge.blue{background:var(--accent)} .badge.grey{background:var(--fg3)}
.grow{flex:1}
.abody{flex:1;display:flex;min-height:0}
.anav{width:248px;border-right:1px solid var(--line2);display:flex;flex-direction:column;flex:none;background:var(--white)}
.anav .hd{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;font:600 17px/1.2 var(--font);border-bottom:1px solid var(--line)}
.tree{flex:1;overflow:auto;padding:4px 0;font-size:12.5px}
.tn{display:flex;align-items:center;gap:6px;padding:2px 8px;cursor:pointer;white-space:nowrap}
.tn:hover{background:var(--hover)} .tn.on{background:var(--sel)}
.tn.l1{padding-left:24px}
.mods{border-top:1px solid var(--line2)}
.mod{display:flex;align-items:center;gap:8px;height:31px;padding:0 8px;border-bottom:1px solid var(--line);font-weight:600;font-size:12.5px;cursor:pointer}
.mod:hover{background:var(--hover)} .mod i{width:4px;height:18px;border-radius:2px;display:block}
.mdi{flex:1;position:relative;background:#f8f8f8;min-width:0;overflow:hidden;display:flex}
.mdimain{flex:1;min-width:0;position:relative;overflow:auto}
.sbar{height:24px;flex:none;border-top:1px solid var(--line2);display:flex;align-items:center;gap:14px;padding:0 10px;font-size:12px;background:var(--chrome2)}
.sbar .demo{display:flex;gap:4px;align-items:center;color:var(--fg2)}
.sbar .demo button{border:1px dashed var(--line2);padding:0 6px;height:18px;border-radius:3px;font-size:11.5px;color:var(--fg)}
.sbar .demo button:hover{background:var(--sel);border-color:var(--accent)}
.sbar .r{margin-left:auto;display:flex;gap:14px;color:var(--fg)}
/* dashboard + RO form */
.dash{padding:24px 28px;max-width:900px}
.dash h1{font:600 20px/1.2 var(--font);margin:0 0 4px} .dash p{color:var(--fg2);margin:0 0 16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile2{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.tile2 b{display:block;font:600 24px/1.1 var(--font);font-variant-numeric:tabular-nums}
.tile2 span{color:var(--fg2);font-size:12px}
.form{background:#fff;margin:12px;border:1px solid var(--line2);display:flex;flex-direction:column;min-height:calc(100% - 24px)}
.ftitle{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;background:var(--chrome);border-bottom:1px solid var(--line2);font-size:12px}
.fbar{display:flex;align-items:center;gap:4px;padding:5px 8px;border-bottom:1px solid var(--line)}
.fgrid{display:grid;grid-template-columns:110px 1fr 110px 1fr;gap:6px 10px;padding:14px;font-size:12.5px;align-items:center}
.fgrid label{color:var(--fg2);text-align:right}
.fgrid .v{border:1px solid var(--line2);height:22px;padding:2px 6px;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lines{margin:0 14px 14px;border:1px solid var(--line2);font-size:12px}
.lines table{width:100%;border-collapse:collapse}
.lines th{background:var(--chrome);font-weight:600;text-align:left;padding:4px 8px;border-bottom:1px solid var(--line2)}
.lines td{padding:4px 8px;border-bottom:1px solid var(--line)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 12px;border:1px solid var(--line2);border-radius:4px;background:#fff;font-weight:600;font-size:12.5px;white-space:nowrap}
.btn:hover{background:var(--hover)} .btn:active{background:#edebe9}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff} .btn.pri:hover{background:var(--accent-hover)}
.btn.dan{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent} .btn.ghost:hover{background:var(--hover)}
.btn[disabled]{opacity:.45;cursor:default}
.ib{width:28px;height:28px;display:inline-grid;place-items:center;border-radius:4px;color:var(--fg2)}
.ib:hover{background:var(--hover);color:var(--fg)} .ib.on{background:var(--sel);color:var(--accent)}
.link{color:var(--accent);cursor:pointer} .link:hover{text-decoration:underline}
/* Connect window */
.cwin{position:absolute;inset:10px;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line2);box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:5}
.cwin.max{inset:0;border:0;box-shadow:none}
.cwin.dock{position:relative;inset:auto;width:400px;flex:none;border-width:0 0 0 1px;box-shadow:none}
.ctitle{height:30px;display:flex;align-items:center;gap:8px;padding-left:10px;border-bottom:1px solid var(--line);font-size:12px;flex:none;background:#fff}
.ctitle .wb{width:40px;height:29px;display:grid;place-items:center;color:var(--fg2)} .ctitle .wb:hover{background:var(--hover)} .ctitle .wb.x:hover{background:#c42b1c;color:#fff}
.ctop{height:40px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--chrome2);flex:none}
.gsearch{flex:0 1 460px;margin:0 auto;display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;background:#fff;border:1px solid var(--line2);border-radius:4px;color:var(--fg3);cursor:text}
.gsearch kbd{margin-left:auto;font:11px var(--font);color:var(--fg3);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.locsel{display:flex;align-items:center;gap:4px;height:28px;padding:0 8px;border-radius:4px;font-size:12px;color:var(--fg2)} .locsel:hover{background:var(--hover)}
.cbody{flex:1;display:flex;min-height:0}
.rail{width:64px;flex:none;background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px}
.ri{width:58px;padding:6px 0 5px;border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--fg2);position:relative}
.ri:hover{background:#e8e6e4;color:var(--fg)}
.ri.on{color:var(--accent);font-weight:600}
.ri.on::before{content:"";position:absolute;left:-3px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent)}
.ri .badge{position:absolute;top:2px;right:9px}
.rail .sp{flex:1}
.me{position:relative;margin-top:4px}
.list{width:280px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#fff}
.lh{display:flex;align-items:center;gap:4px;padding:10px 8px 6px 14px;flex:none}
.lh h2{font:600 16px/1.2 var(--font);margin:0;flex:1}
.lfilter{display:flex;gap:4px;padding:2px 12px 8px;flex-wrap:wrap;flex:none}
.chip{height:24px;padding:0 10px;border-radius:12px;border:1px solid var(--line2);font-size:12px;background:#fff;display:inline-flex;align-items:center;gap:4px}
.chip:hover{background:var(--hover)} .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-press);font-weight:600}
.lscroll{flex:1;overflow:auto;min-height:0}
.lgrp{font-size:11.5px;font-weight:600;color:var(--fg2);padding:10px 14px 4px;display:flex;align-items:center;gap:4px}
.li{display:flex;align-items:center;gap:10px;padding:7px 10px 7px 14px;cursor:pointer;position:relative}
.li:hover{background:var(--hover)}
.li.on{background:var(--sel)}
.li .nm{flex:1;min-width:0}
.li .t1{display:flex;gap:6px;align-items:baseline}

.need .nt{display:flex;gap:6px;align-items:center;font-weight:600;font-size:12.5px}

.need .na{display:flex;gap:4px;margin-top:6px}
.wcount{display:inline-flex;gap:3px;align-items:center;font-size:11px;color:var(--fg2);margin-right:6px}
.wstrip{display:flex;gap:6px;align-items:center;padding:7px 16px;border-bottom:1px solid var(--line);background:var(--chrome2);overflow-x:auto;flex:none}
.wstrip .lbl{font:600 11px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);flex:none;margin-right:4px}

.wchip:hover{border-color:var(--accent)} .wchip.on{border-color:var(--accent);background:var(--sel)}
.tl{flex:1;overflow:auto;min-height:0;padding:10px 20px 14px 0;background:#fff;position:relative}
.tl::before{content:"";position:absolute;left:39px;top:0;bottom:0;width:2px;background:var(--line)}
.ev{position:relative;padding:4px 0 4px 64px;min-height:26px}

.ev:hover{background:var(--chrome2)} .ev:hover .eact{display:flex}
.ev .eact button{height:26px;padding:0 7px;display:inline-flex;align-items:center;gap:4px;color:var(--fg2);font-size:12px} .ev .eact button:hover{background:var(--hover);color:var(--fg)}
.ev.flow .txt{color:var(--fg2);font-size:12px}
.wcard{border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:4px;background:#fff;max-width:560px;margin:3px 0;cursor:pointer}
.wcard:hover{border-color:var(--line2);border-left-color:var(--tc);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.wcard .wh{display:flex;gap:8px;align-items:center;padding:8px 10px 4px}
.wcard .wh b{flex:1;font-size:13px}
.wcard .wm{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 10px 8px;font-size:12px;color:var(--fg2)}
.wcard .wa{display:flex;gap:6px;padding:0 10px 9px}
.tlabel{font:700 10px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--tc)}
.modes{display:flex;gap:2px;margin-bottom:6px}
.mode{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:14px;font-size:12.5px;color:var(--fg2);border:1px solid transparent}
.mode:hover{background:var(--chrome2)} .mode.on{border-color:var(--tc);color:var(--fg);background:#fff;font-weight:600;box-shadow:inset 0 0 0 1px var(--tc)}
.wfields{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--chrome2)}
.wfields .fld{margin:0} .wfields label{font-size:11px;color:var(--fg2);font-weight:600}
.wfields input,.wfields select{border:1px solid var(--line2);border-radius:4px;height:28px;padding:0 6px;background:#fff;width:100%;min-width:0}
.steps{display:flex;gap:0;margin:10px 0 4px}
.step{flex:1;text-align:center;font-size:10.5px;color:var(--fg3);position:relative;padding-top:16px}
.step::before{content:"";position:absolute;top:4px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--line2);z-index:1}
.step::after{content:"";position:absolute;top:8px;left:-50%;width:100%;height:2px;background:var(--line2)}
.step:first-child::after{display:none}
.step.done{color:var(--fg)} .step.done::before,.step.done::after{background:var(--accent)}
.step.cur{color:var(--accent-press);font-weight:600} .step.cur::before{background:#fff;box-shadow:0 0 0 2px var(--accent)} .step.cur::after{background:var(--accent)}
.hist{border-left:2px solid var(--line);margin:6px 0 0 4px;padding-left:12px}
.hist div{position:relative;margin:0 0 9px;font-size:12px} .hist div::before{content:"";position:absolute;left:-17px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--line2)}
.hist small{display:block;color:var(--fg3);font-size:11px}
.wtable tr.sel td{background:var(--sel)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:12px 14px;text-align:left;background:#fff;border-top:3px solid var(--tc)}
.kpi:hover{background:var(--chrome2)} .kpi.on{box-shadow:0 0 0 2px var(--tc) inset}
.kpi b{display:block;font:600 28px/1.1 var(--font);font-variant-numeric:tabular-nums}
.kpi span{color:var(--fg2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.fbar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.kv .rchip{height:auto;min-height:26px;padding:3px 8px 3px 3px;white-space:normal}
.fbar2 select{border:1px solid var(--line2);border-radius:4px;height:28px;padding:0 6px;background:#fff}
@media print{.side2,.ctitle,.comp2,.mh .acts{display:none}}
/* ---- Smart tasks ---- */
.spark{fill:var(--ai);flex:none}
.aibtn{border-color:#bfdcc3;color:#1f6b2a;background:linear-gradient(#fff,#f6fbf6)}
.aibtn:hover{background:var(--ai-soft);border-color:var(--ai)} .aibtn.on{background:var(--ai-soft);border-color:var(--ai)}
.aibtn.busy .spark{animation:spin 1.1s linear infinite}
.aibadge{align-self:center;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:#1f6b2a;background:var(--ai-soft);border-radius:11px;padding:3px 9px;margin-right:4px;white-space:nowrap}
.aitag{display:inline-flex;align-items:center;gap:3px;font:700 10px/1 var(--font);color:#1f6b2a;background:var(--ai-soft);border-radius:8px;padding:3px 6px}
.ainote{display:flex;gap:8px;align-items:flex-start;background:var(--ai-soft);border:1px solid #bfdcc3;color:#174d20;border-radius:6px;padding:7px 10px;margin-bottom:6px;font-size:12.5px;animation:rise .25s var(--ease)}
.aihint{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:#1f6b2a;background:var(--ai-soft);border-radius:12px;padding:2px 4px 2px 9px;animation:fade .4s var(--ease)}
.tray{margin:8px 16px 0;border:1px solid #bfdcc3;border-radius:8px;background:linear-gradient(180deg,#f6fbf6,#fff 60px);box-shadow:0 6px 20px -12px rgba(30,90,40,.3);animation:rise .3s var(--ease);flex:none;max-height:45%;overflow:auto}
.trayh{display:flex;align-items:center;gap:8px;padding:9px 10px 7px 12px;font-size:13px}
.trayh .muted{color:var(--fg2);font-size:12px}
.sg{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-top:1px solid #e1efe3;border-left:3px solid var(--tc);animation:rise .3s var(--ease) both}
.sg:nth-child(3){animation-delay:.06s}.sg:nth-child(4){animation-delay:.12s}.sg:nth-child(5){animation-delay:.18s}.sg:nth-child(6){animation-delay:.24s}
.sg > svg{margin-top:3px}
.sgm{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12px;color:var(--fg2);margin-top:3px}
.sgm select{border:1px solid var(--line2);border-radius:4px;height:22px;font-size:12px;margin-left:3px;background:#fff}
.sginput{width:100%;border:1px solid var(--accent);border-radius:4px;height:28px;padding:0 6px}
.why{font-size:12px;color:#3d6b45;margin-top:3px}
.sga{display:flex;gap:4px;flex:none}
.trayf{font-size:11.5px;color:var(--fg3);padding:6px 12px 9px}
.plan{border:1px solid #bfdcc3;border-radius:8px;background:linear-gradient(180deg,#f6fbf6,#fff 60px);margin-bottom:14px;animation:rise .3s var(--ease)}
.plan ol{list-style:none;margin:0;padding:0 8px 8px}
.plan li{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:6px;cursor:pointer;animation:rise .3s var(--ease) both;max-width:none}
.plan li:hover{background:var(--ai-soft)} .plan li.done{opacity:.5} .plan li.done b{text-decoration:line-through}
.plan li small{display:block;color:var(--fg2);font-size:12px}
.plan li .num{width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid #bfdcc3;display:grid;place-items:center;font:600 11px/1 var(--font);color:#1f6b2a;flex:none}
.plan li:nth-child(2){animation-delay:.04s}.plan li:nth-child(3){animation-delay:.08s}.plan li:nth-child(4){animation-delay:.12s}.plan li:nth-child(5){animation-delay:.16s}.plan li:nth-child(6){animation-delay:.2s}
.sumtxt{white-space:pre-wrap;line-height:1.6;font-size:13px}
.sumrow{display:flex;gap:8px;align-items:center;padding:6px 4px;border-radius:4px;cursor:pointer;font-size:12.5px} .sumrow:hover{background:var(--chrome2)}
.caret{display:inline-block;width:7px;height:14px;background:var(--ai);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
.shimmer{height:12px;border-radius:6px;margin:10px 0;background:linear-gradient(90deg,#e1efe3 25%,#f3faf4 50%,#e1efe3 75%);background-size:200% 100%;animation:shim 1.2s linear infinite}
.tourwrap{position:absolute;inset:0;z-index:80;pointer-events:none}
.tourhl{position:absolute;border:2px solid var(--ai);border-radius:8px;box-shadow:0 0 0 9999px rgba(10,30,15,.3);transition:all .3s var(--ease)}
.tour{position:absolute;width:320px;background:#fff;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.3);padding:14px 16px;pointer-events:auto;animation:rise .3s var(--ease);transition:left .3s var(--ease),top .3s var(--ease)}
.tour b{font-size:15px} .tour p{margin:6px 0 12px;color:var(--fg2);font-size:13px}
.tstep{font-size:11px;color:#1f6b2a;font-weight:600;margin-bottom:4px}
/* ---- Smooth ---- */
.btn,.ib,.chip,.li,.need,.wchip,.wcard,.kpi,.mode,.dtab,.tab,.rchip,.sumrow,.pc{transition:background-color .15s var(--ease),border-color .15s var(--ease),box-shadow .2s var(--ease),color .15s var(--ease),transform .15s var(--ease)}
.btn:active,.kpi:active,.need:active{transform:scale(.98)}
.dtab.on::after{animation:grow .25s var(--ease)}
.panel{animation:slidein .26s var(--ease)}
.scrim{animation:fade .18s ease} .dlg{animation:pop .22s var(--ease)}
.pop{animation:popdown .14s var(--ease);transform-origin:top left}
.snack{animation:snack .25s var(--ease)}
.wtoast{animation:slidein .3s var(--ease)}
.ev{animation:fade .3s var(--ease)}
.wcard .pill,.need .pill,.wchip .pill{transition:background-color .3s,color .3s}
.need{animation:rise .25s var(--ease) both}
.main,.page{animation:fade .2s ease}
.mode.on{transition:all .2s var(--ease)}
.wfields{animation:rise .2s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes popdown{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
@keyframes snack{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes grow{from{transform:scaleX(.3);opacity:.4}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes shim{to{background-position:-200% 0}}
/* ---- ASPEN skin: a dealership work desk, not a chat app ---- */
:root{--label:"Bahnschrift","Segoe UI Semibold","Segoe UI",sans-serif;--desk:#f3f1ea;--rule:#ddd6c4}
.dhead{background:linear-gradient(180deg,var(--brand),#16301f);border-bottom:0;height:50px;padding-left:10px;gap:4px}

.dhead .pres{border-color:var(--brand)}
.aibadge{background:rgba(255,255,255,.12);color:#d4f0d8}
.av{border-radius:7px} .av.s24,.av.s20{border-radius:5px} .av.s72,.av.s96{border-radius:14px}
.inbox{background:var(--desk);border-right-color:var(--rule)}
.band{font-family:var(--label);letter-spacing:.14em;color:var(--brand2);font-size:11px;padding-top:14px}
.band::after{content:"";flex:1;height:1px;background:var(--rule);margin-left:4px}
.need{position:relative;background:var(--paper);border:1px solid #e4dccb;border-radius:3px;margin:6px 12px;padding:9px 10px 9px 22px;box-shadow:0 1px 0 #e4dccb}
.need::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--tc);border-radius:3px 0 0 3px}
.need::after{content:"";position:absolute;left:13px;top:7px;bottom:7px;border-left:1.5px dashed #d3cbb6}
.need:hover{border-color:#cfc5ad} .need.on{background:#fff;box-shadow:0 0 0 2px var(--accent)}
.inbox .li:hover{background:#ebe7dc} .inbox .li.on{background:#fff;box-shadow:inset 4px 0 0 var(--brand2)}

.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.wstrip{background:var(--desk);border-bottom-color:var(--rule)}
.wstrip .lbl,.tlabel,.kpi span,.sect{font-family:var(--label);letter-spacing:.1em}
.wchip{border-radius:4px}
.tl::before{background:repeating-linear-gradient(180deg,#c8d3c9 0 7px,transparent 7px 11px);width:2px}
.wcard{background:var(--paper);border-color:#e7e0cd;border-radius:3px}
.wno{display:inline-flex;align-items:center;font:600 11px/1 Consolas,"Cascadia Mono",monospace;color:var(--tc);border:1px solid currentColor;border-radius:3px;padding:2px 5px;white-space:nowrap;flex:none;background:#fff}

/* ================= Phone layout ================= */
.mroot{position:fixed;inset:0;display:flex;background:var(--white)}
.mroot .cwin.m{border-radius:0}
.phonestage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(circle at 50% 30%,#eef3ee,#d9dfd9)}
.phonecap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;color:var(--fg2);font-size:13px} .phonecap b{color:var(--fg)}
.phone{position:relative;width:390px;height:844px;max-height:calc(100vh - 110px);border-radius:52px;background:#0b0d0c;padding:12px;box-shadow:0 30px 80px -20px rgba(0,0,0,.55),inset 0 0 0 2px #2a2f2c;display:flex;flex-direction:column}
.pnotch{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:120px;height:32px;border-radius:18px;background:#000;z-index:90}
.pstatus{position:absolute;top:22px;left:40px;right:40px;display:flex;justify-content:space-between;font:600 13px var(--font);color:var(--fg);z-index:89;pointer-events:none}
.phone .cwin.m{border-radius:40px;padding-top:44px}
.cwin.m{position:relative;inset:auto;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--white);border:0;box-shadow:none;width:100%}
.mbar{flex:none;display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:8px 10px 8px 16px;background:var(--brand);color:#fff}
.mbar .mbart{flex:1;display:flex;align-items:center;gap:9px;min-width:0} .mbar b{font:700 19px/1.1 var(--label);letter-spacing:.01em}
.mbar .ib{width:40px;height:40px;color:#d6e8da;border-radius:12px} .mbar .ib:hover{background:rgba(255,255,255,.12);color:#fff}
.mlogo{width:26px;height:26px;border-radius:7px;background:#3a9a3e;display:grid;place-items:center;font:700 13px/1 var(--font);color:#fff}
.msearch{flex:0 0 100%;display:flex;gap:10px;align-items:center;padding:8px 0 2px}
.msearch .sbox{flex:1;margin:0;height:38px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#d6e8da} .msearch input{color:#fff;font-size:15px} .msearch .link{color:#d6e8da;font-weight:600}
.mbody{flex:1;min-height:0;display:flex;overflow:hidden;position:relative}
.mbody>*{flex:1;min-width:0}
.sb.mfull{width:100%!important;border:0;transition:none}
.sb.mfull .sbh{display:none} .sb.mfull .sbfoot{display:none}
.m .sb .li{padding:11px 12px;margin:2px 8px} .m .sb .li .t1 b{font-size:15px} .m .sb .li .t2{font-size:13.5px} .m .sb .li .av,.m .sb .li .recband{width:40px;height:40px;font-size:13px}
.m .seg2{overflow-x:auto;scrollbar-width:none} .m .seg2 button{flex:none;padding:0 12px}
.m .mh .btn.sm{font-size:0;gap:0;width:38px;padding:0;justify-content:center} .m .mh .btn.sm svg{width:17px;height:17px}
.m .seg2{margin:10px 12px 8px} .m .seg2 button{height:34px;font-size:13px}
.m .need{margin:6px 12px} .m .need .nt{font-size:14px} .m .need .na .btn{height:34px;padding:0 14px;font-size:13px}
.m .band{padding:16px 16px 6px}
.mtabs{flex:none;display:flex;border-top:1px solid var(--line);background:var(--white);padding:4px 4px max(8px,env(safe-area-inset-bottom,0px))}
.mtab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;font-size:11px;font-weight:600;color:var(--fg2);border-radius:12px}
.mtab.on{color:var(--accent-press)} .mtab.on .mtabic{background:var(--accent-soft)}
.mtabic{position:relative;width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
.mtabic .badge{position:absolute;top:-4px;right:2px} .mtabic .mb2{right:auto;left:2px;background:var(--orange)}
.m .mh{height:60px;padding:0 6px 0 4px;gap:8px} .m .mh .tt b{font-size:16px} .m .mh .tt small{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.mback{width:40px;height:40px} .m .mh .btn.sm{height:34px}
.m .wstrip{padding:8px 12px} .m .tl{padding:10px 12px 14px 0} .m .tl::before{left:27px}
.m .ev{padding:6px 8px 6px 54px} .m .ev .node{left:20px} .m .ev .node[style]{left:16px!important}
.m .day{margin-left:54px} .m .newdiv{margin-left:54px}
.m .ev .txt{font-size:15px;max-width:none}
.m .ev .eact{display:none;top:auto;bottom:-14px;right:8px} .m .ev:focus-within .eact,.m .ev:focus .eact{display:flex}
.m .ev:focus{outline:none;background:var(--chrome2)}
.m .wcard .wh{flex-wrap:wrap} .m .wcard .wa .btn{height:34px;padding:0 14px}
.m .cmp{padding:6px 8px max(8px,env(safe-area-inset-bottom,0px))}
.m .cmpinput{font-size:16px;padding:11px 12px 2px}
.m .cmpbar{flex-wrap:nowrap;gap:2px;padding:4px 6px 6px} .m .cmphint{display:none} .m .cmpkindbtn{padding:0 9px} .m .cmpic{width:34px;height:34px} .m .cmpsep{margin:0 2px}
.m .cmpai{padding:0 9px} .m .cmpsend{height:38px;padding:0 14px;border-radius:12px}
.m .cmpfields{overflow-x:auto;flex-wrap:nowrap;padding-bottom:6px} .m .fpill{flex:none}
.m .modepop,.m .cmp .mentionpop{left:8px;right:8px;width:auto}
.msheet{position:absolute;inset:0;z-index:40;background:rgba(10,20,14,.4);display:flex;flex-direction:column;justify-content:flex-end;animation:fade .2s}
.msheet>.panel{width:100%!important;max-height:86%;border-radius:20px 20px 0 0;border:0;animation:sheetup .28s var(--ease)}
.mgrab{align-self:center;width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.75);margin:0 0 8px;cursor:pointer}
@keyframes sheetup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.m .page{padding:14px 12px 20px} .m .page h1{font-size:20px} .m .page .sub{font-size:13px}
.m .kpis{grid-template-columns:1fr 1fr;gap:8px} .m .kpi{padding:10px 12px} .m .kpi b{font-size:24px}
.m .fbar2{gap:6px} .m .fbar2>b{flex:0 0 100%}
.m .wtable{border:0;background:transparent} .m .wtable table,.m .wtable tbody{display:block} .m .wtable thead{display:none}
.m .wtable tr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:12px 14px;margin-bottom:8px;background:var(--paper);border:1px solid var(--rule);border-radius:12px}
.m .wtable td{border:0;padding:0;font-size:12.5px;color:var(--fg2)}
.m .wtable td:nth-child(1){grid-column:1/2;font-size:14.5px;color:var(--fg);font-weight:600;line-height:1.35}
.m .wtable td:last-child{grid-column:2/3;grid-row:1}
.m .wtable td:nth-child(4){grid-column:1/3}
.m .wtable td:nth-child(2),.m .wtable td:nth-child(3),.m .wtable td:nth-child(5),.m .wtable td:nth-child(6){display:none}
.m .wtable tr:has(input) td:nth-child(1){display:none}

.suggest button{border:1px solid var(--line2);background:var(--white);border-radius:14px;padding:3px 10px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--fg)}.suggest button:hover{border-color:var(--accent);color:var(--accent)}
.cmpic.on{color:var(--accent);background:var(--accent-soft)}
.cmpic.rec{color:var(--red);background:var(--red-soft)}
.schedbar{border:1px solid var(--line);border-radius:8px;margin:6px 16px;background:var(--chrome2);font-size:12.5px}
.schedrow{display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--line)}.schedrow:first-child{border-top:0}
.savedrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
/* work extras */
.itemx{display:flex;flex-direction:column;gap:12px;margin:12px 0}
.ckbox{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.ckhead{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.ckbar{height:4px;border-radius:2px;background:var(--line);margin:8px 0;overflow:hidden}.ckbar i{display:block;height:100%;background:var(--green)}
.ckrow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}.ckrow.done span{text-decoration:line-through;color:var(--fg3)}
.ckadd{display:flex;gap:6px;margin-top:6px}.ckadd input{flex:1;border:1px solid var(--line2);border-radius:4px;padding:4px 8px;font:inherit;font-size:13px;background:var(--white);color:var(--fg)}
.cklist{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--fg2);margin-top:6px}
.ckprog{color:var(--green)}
.escrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg2);padding:8px 10px;border-radius:6px;background:var(--chrome2)}
.escrow.hot{background:var(--amber-bg);color:var(--amber)}
.outlookbtn{align-self:flex-start}
.oooban{background:var(--amber-bg);color:var(--amber)}
.wvbar{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.wvseg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.wvseg button{border:0;background:var(--white);padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--fg)}.wvseg button+button{border-left:1px solid var(--line2)}
.wvseg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.bulk{display:flex;align-items:center;gap:6px;background:var(--accent-soft);border-radius:6px;padding:4px 6px 4px 10px;font-size:12.5px}
.board{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:12px;align-items:start}
.bcol2{background:var(--chrome2);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:240px}.bcol2.over{border-color:var(--accent);background:var(--accent-soft)}
.bhead{display:flex;justify-content:space-between;font-weight:600;font-size:12.5px;color:var(--fg2);padding:2px 4px 8px;text-transform:uppercase;letter-spacing:.04em}
.bcard{background:var(--white);border:1px solid var(--line);border-left:3px solid var(--tc,var(--accent));border-radius:6px;padding:8px 10px;margin-bottom:6px;cursor:grab;font-size:13px}
.bcard:hover{border-color:var(--line2)}
.bct{display:flex;gap:7px;align-items:baseline;font-weight:600;margin-bottom:4px;line-height:1.3}.bct svg{flex:none;transform:translateY(1px)}.bcm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--fg2)}
.bempty{font-size:12px;color:var(--fg3);text-align:center;padding:20px 0}
.calbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.calday{min-height:150px;border-left:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--white)}.calday:first-child{border-left:0}
.calday.today{background:var(--sel)}.calday.late .calh{color:var(--red)}
.calh{font-size:12px;font-weight:600;color:var(--fg2)}
.calitem{text-align:left;border:0;border-left:3px solid var(--tc,var(--accent));background:var(--chrome2);border-radius:4px;padding:3px 6px;font:inherit;font-size:12px;cursor:pointer;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* AI */
.brief{margin:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--ai-soft);font-size:12.5px}
.briefh{display:flex;align-items:center;gap:6px;padding:8px 6px 4px 12px;cursor:pointer}.briefh b{font-size:13px}
.brief ul{margin:0;padding:0 8px 6px;list-style:none}.briefmore{border:0;background:none;color:var(--accent);font:inherit;font-size:12px;padding:0 12px 8px;cursor:pointer}
.briefline{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%;text-align:left;border:0;background:transparent;padding:3px 4px;border-radius:4px;font:inherit;color:var(--fg);cursor:pointer;line-height:1.35}.briefline:hover{background:rgba(0,0,0,.05)}
.briefline::before{content:"•";color:var(--ai);margin-right:6px}
.briefai{padding:0 12px 10px;white-space:pre-wrap;line-height:1.45}
.handofft{width:100%;min-height:320px;border:1px solid var(--line2);border-radius:6px;padding:10px;font:inherit;font-size:12.5px;line-height:1.5;resize:vertical;background:var(--white);color:var(--fg);box-sizing:border-box}
.ask{margin:8px 10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--ai-soft);font-size:13px}
.askh{display:flex;align-items:center;gap:6px;margin-bottom:6px}.askh span{color:var(--fg3);font-size:11.5px}
.askans{line-height:1.45}
.asksrc{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}.asksrc button{border:1px solid var(--line2);background:var(--white);border-radius:12px;padding:2px 9px;font:inherit;font-size:11.5px;cursor:pointer;color:var(--fg)}
/* notifications */
.bell{position:relative;align-self:center;width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:#fff;cursor:pointer;display:grid;place-items:center}.bell:hover,.bell.on{background:rgba(255,255,255,.14)}
.bellc{position:absolute;top:2px;right:1px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.notebar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.note{display:flex;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 14px;font:inherit;font-size:13px;color:var(--fg);cursor:pointer}.note:hover{background:var(--hover)}
.note.un{background:var(--sel)}.note.un .notet{font-weight:600}
.noteic{width:28px;height:28px;border-radius:50%;background:var(--chrome);display:grid;place-items:center;flex:none;color:var(--fg2)}
.notet{line-height:1.35}.notet small{display:block;font-weight:400;color:var(--fg3);font-size:11.5px;margin-top:2px}
.notefoot{padding:8px 14px;border-top:1px solid var(--line)}
.pisub{font-size:11px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em;padding:6px 12px 2px}
/* insights / settings pages */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--white)}.kpi b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}.kpi span{font-size:12.5px;color:var(--fg2)}.kpi small{display:block;font-size:11.5px;color:var(--fg3);margin-top:2px}
.ilist{display:flex;flex-direction:column;gap:6px;max-width:560px}
.irow{display:grid;grid-template-columns:170px 1fr 48px;align-items:center;gap:10px;font-size:13px}.irow b{text-align:right;font-variant-numeric:tabular-nums}
.ibar{height:8px;border-radius:4px;background:var(--chrome);overflow:hidden}.ibar i{display:block;height:100%;border-radius:4px}
.intg{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);max-width:640px}
.intgic{width:36px;height:36px;border-radius:8px;background:var(--chrome);display:grid;place-items:center;flex:none;color:var(--fg2)}
.intgt{flex:1;display:flex;flex-direction:column;gap:2px;font-size:13px}.intgt span{color:var(--fg2);font-size:12.5px}.intgt code{font-family:var(--mono);font-size:11.5px;color:var(--fg2);margin-top:3px}
/* text size + high contrast */
html[data-ts="s"]{font-size:93%}html[data-ts="l"] body{zoom:1.1}html[data-ts="xl"] body{zoom:1.22}
html.hc{--fg2:#3b3a39;--fg3:#4a4948;--line:#8a8886;--line2:#605e5c}
html.hc.dark{--fg2:#d6ddd8;--fg3:#c3ccc5;--line:#7d8a80;--line2:#9aa79d}
html.hc :focus-visible{outline:3px solid var(--accent)!important;outline-offset:2px}/* dark tweaks */
html.dark .smstag:where(.cwin *,.cwin,.phonestage *,.phonestage){background:#3a2216}html.dark .briefline:hover:where(.cwin *,.cwin,.phonestage *,.phonestage){background:rgba(255,255,255,.06)}
@media (max-width:760px){.board{grid-template-columns:1fr}.cal{grid-auto-flow:row;grid-template-columns:1fr}.calday{min-height:0;border-left:0;border-top:1px solid var(--line)}.irow{grid-template-columns:110px 1fr 40px}}
.cmpto{display:inline-flex;align-items:center;gap:5px;height:28px;border:1px solid var(--line2);border-radius:14px;background:var(--white);padding:0 10px;font:inherit;font-size:12px;color:var(--fg2);cursor:pointer;white-space:nowrap}.cmpto:hover{border-color:var(--cust);color:var(--cust)}
.cmpto.on{background:var(--cust);border-color:var(--cust);color:#fff}
.m .mh .tt{flex:1;min-width:0}.m .mh .tt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .mh .workbtn{padding:0 8px;flex:none}
.m .wcard .wh>b,.m .wcard .wh .tt{flex:1 1 100%;order:3}
.suggest{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.suggest button{flex:none}
@container (max-width:520px){.cmpto{width:30px;padding:0;justify-content:center;font-size:0;gap:0}.cmpto svg{width:14px;height:14px}.cmpto.on{width:auto;padding:0 8px;font-size:12px;gap:4px}}
.m .mh .tt{min-width:84px}.m .mh .workbtn svg:last-child{display:none}
@container (max-width:420px){.cmpkindbtn{font-size:0!important;gap:4px!important;padding:0 8px!important}.cmpsend{font-size:0!important;gap:0!important;width:38px;padding:0!important;justify-content:center}.cmpbar .cmpic{width:28px;min-width:28px}}
.smstag{white-space:nowrap}
@container (max-width:420px){.cmpbar .cmpto{width:28px!important;height:28px;border-radius:50%;flex:none}.cmpsend{width:34px!important;flex:none}.cmpbar .cmpic{width:26px;min-width:26px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ---- MVP round: New task button, Teams-style app bar, ASPEN record picker ---- */
.newtaskbtn{align-self:center;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 14px;border-radius:16px;background:#fff;color:var(--brand);font:600 13px/1 var(--font);border:0;box-shadow:0 1px 2px rgba(0,0,0,.18);transition:background .15s,transform .1s}
.newtaskbtn:hover{background:#e9f5ea}.newtaskbtn:active{transform:scale(.97)}
.newtaskbtn svg{color:var(--brand)}
.apprail{width:68px;background:var(--chrome2);border-right:1px solid var(--line);padding:8px 0;gap:4px}
.apprail .ri{width:60px;padding:8px 0 6px;border-radius:6px;font-size:11px;transition:background .15s,color .15s}
.apprail .ri:hover{background:var(--hover)}
.apprail .ri.on{background:var(--sel)}
.apprail .ri.on::before{left:-4px;top:12px;bottom:12px}
.apprail .ri .badge{top:3px;right:12px}
.recfield{display:flex;flex-direction:column;gap:6px;min-width:0}
.rfchips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.rfchips .rchip{max-width:100%}
.rfadd{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border:1px dashed var(--accent);border-radius:13px;color:var(--accent);font-size:12px;font-weight:600;background:transparent}
.rfadd:hover{background:var(--accent-soft)}
.rfsugg{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--fg2)}
.rfsugg button{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border:1px dashed var(--line2);border-radius:12px;font-size:12px;color:var(--fg)}
.rfsugg button:hover{border-color:var(--accent);color:var(--accent)}
.rbrowse{border:1px solid var(--line2);border-radius:8px;background:var(--white);display:flex;flex-direction:column;overflow:hidden;animation:rise .2s var(--ease)}
.rbsearch{display:flex;align-items:center;gap:8px;margin:10px 10px 0;height:34px;padding:0 10px;border:1px solid var(--line2);border-radius:6px;color:var(--fg3)}
.rbsearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.rbsearch input{flex:1;min-width:0;border:0;outline:0;background:transparent}
.rbtypes{display:flex;gap:4px;padding:8px 10px;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--line)}
.rbtypes button{flex:none;height:26px;padding:0 10px;border:1px solid var(--line2);border-radius:13px;font-size:12px;color:var(--fg2);display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.rbtypes button i{font-style:normal;font-size:11px;opacity:.7}
.rbtypes button:hover{border-color:var(--accent);color:var(--fg)}
.rbtypes button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.rblist{max-height:260px;overflow:auto;padding:4px}
.rbh{font-size:11.5px;font-weight:600;color:var(--fg2);padding:8px 8px 3px}
.rbrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 8px;border-radius:6px}
.rbrow:hover{background:var(--hover)}.rbrow.on{background:var(--sel)}
.rbbox{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--fg3);display:grid;place-items:center;flex:none;color:#fff}
.rbrow.on .rbbox{background:var(--accent);border-color:var(--accent)}
.rbk{display:inline-grid;place-items:center;min-width:34px;height:20px;padding:0 4px;border-radius:3px;color:#fff;font:700 9.5px/1 var(--font);flex:none}
.rbt{flex:1;min-width:0}.rbt b{display:block;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbt small{display:block;color:var(--fg2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbempty{padding:18px 10px;color:var(--fg2);font-size:12.5px;text-align:center}
.rbfoot{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--fg2)}
.rbfoot span{flex:1}
.recdlg{width:600px}.recdlg .rbrowse{border:0}.recdlg .rblist{max-height:340px}.recdlg .db{padding:0 12px}
.recpill{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;height:auto!important;min-height:28px;padding:2px 4px 2px 10px!important}
.recpill .rchip{height:22px}.recpill .rfadd{height:22px}
.panel .kv .recfield .rbrowse{margin-top:4px}
.panel .kv{grid-template-columns:96px minmax(0,1fr)}.panel .kv>span{min-width:0}
/* ---- Task details, Teams/Planner style ---- */
.panel.tdp{background:var(--white)}
.tdhd{display:flex;align-items:center;gap:8px;height:48px;padding:0 8px 0 18px;border-bottom:1px solid var(--line);flex:none}
.tdtype{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--font);color:var(--fg2)}
.tdhd .wno{font-size:11px}
.tdbody{padding:18px 20px 24px!important;display:flex;flex-direction:column;gap:14px}
.tdtitle{display:flex;gap:10px;align-items:flex-start}
.tdtitle h2{margin:0;font:600 18px/1.3 var(--font);color:var(--fg);text-wrap:balance}
.tdtitle h2.done{text-decoration:line-through;color:var(--fg2)}
.tdchk{width:22px;height:22px;margin-top:2px;border-radius:50%;border:1.5px solid var(--fg3);display:grid;place-items:center;color:transparent;flex:none;transition:all .15s}
.tdchk:not([disabled]):hover{border-color:var(--accent);color:var(--accent)}
.tdchk.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tdchk[disabled]{cursor:default;opacity:.6}
.tdpills{display:flex;gap:6px;flex-wrap:wrap;margin-top:-4px}
.tdsteps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tdsteps li{display:flex;flex-direction:column;gap:5px;font-size:10.5px;color:var(--fg3);min-width:0}
.tdsteps li i{display:block;height:4px;border-radius:2px;background:var(--line)}
.tdsteps li.done i{background:var(--accent)}
.tdsteps li.cur i{background:linear-gradient(90deg,var(--accent) 50%,var(--line) 50%)}
.tdsteps li.done{color:var(--fg2)}.tdsteps li.cur{color:var(--accent);font-weight:600}
.tdsteps li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdact{display:flex;gap:8px;flex-wrap:wrap}
.tdact .btn{height:32px;padding:0 16px;border-radius:6px}
.tdact.col{flex-direction:column;gap:6px}
.tdact.col label{font-weight:600;font-size:12.5px}.tdact.col label span{font-weight:400;color:var(--fg2)}
.tdact.col textarea{border:1px solid var(--line2);border-radius:6px;padding:8px 10px;min-height:70px;resize:vertical}
.tdact.col textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tdbtns{display:flex;gap:8px}
.tdfields{display:flex;flex-direction:column;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0}
.tdrow{display:flex;gap:12px;align-items:center;padding:5px 0}
.tdic{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--fg2);background:var(--chrome2);flex:none}
.tdf{flex:1;min-width:0}
.tdf small{display:block;font-size:11.5px;color:var(--fg2);margin-bottom:2px}
.tdv{font-size:13px;color:var(--fg);min-width:0;overflow-wrap:anywhere}
.tdperson{display:inline-flex;align-items:center;gap:8px}
.tdpick{display:inline-flex;align-items:center;gap:8px;padding:2px 8px 2px 2px;margin-left:-2px;border-radius:16px;cursor:pointer;color:var(--fg2);transition:background .15s}
.tdpick:hover{background:var(--hover)}
.tdpick select{border:0;background:transparent;font:inherit;color:var(--fg);appearance:none;-webkit-appearance:none;cursor:pointer;padding:0;outline:0}
.tdpick:focus-within{box-shadow:0 0 0 2px var(--accent)}
.tdnote{margin:0;color:var(--fg2);font-size:12px}
.tdmore .itemx{margin:0;gap:8px}
.tdmore .ckbox{border-radius:8px;background:var(--white)}
.tdmore .escrow{border-radius:6px;background:var(--amber-bg);color:var(--amber)}
.tdmore .outlookbtn,.tdmore > .btn.ghost{display:flex;width:100%;justify-content:flex-start;gap:10px;height:34px;padding:0 10px;margin:0!important;border:0;border-radius:6px;background:transparent;color:var(--fg);font-weight:400;align-self:stretch}
.tdmore .outlookbtn:hover,.tdmore > .btn.ghost:hover{background:var(--hover)}
.tdmore .outlookbtn.on{color:var(--accent)}
.tdmore{display:flex;flex-direction:column;gap:2px}
.tdhist{border-top:1px solid var(--line);padding-top:10px}
.tdhist summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font:600 13px/1.6 var(--font);color:var(--fg)}

.tdhist[open] summary svg{transform:none}
.tdhist summary span{font-weight:400;color:var(--fg2);font-size:12px}
.tdhist .hist{margin-top:8px}
/* ==== Teams look and feel (light). Same features, Teams-style surfaces, type and message bubbles. ASPEN green stays the accent. ==== */
.cwin{--label:var(--font);--t-frame:#ebebeb;--t-pane:#f5f5f5;--t-card:#ffffff;--t-line:#e0e0e0;--t-fg:#242424;--t-fg2:#616161;--t-hover:#fafafa;--t-mine:#e3efe7;--t-acc:#2e6b47;--t-acc-h:#255a3b}
html:not(.dark) .cwin{font-family:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",sans-serif;color:var(--t-fg)}
/* title bar */
html:not(.dark) .cwin .ctitle{background:var(--t-frame);border-bottom:0}

html.lg .cwin.cwin .snack{border-radius:2px;background:var(--lg-ink);color:var(--lg-paper);box-shadow:var(--lg-shadow)}
html.lg .cwin.cwin .snack .link{color:var(--lg-brass)}
html.lg .cwin.cwin .tour{border-radius:2px;border:1px solid var(--lg-rule2);background:var(--lg-sheet);box-shadow:0 30px 70px -20px rgba(20,16,4,.6)}
html.lg .cwin.cwin .tour b{font:600 17px/1.2 var(--lg-serif)} html.lg .cwin.cwin .tstep{font:600 9.5px/1.4 var(--lg-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lg-brass)}
html.lg .cwin.cwin .tourhl{border:2px solid var(--lg-brass);border-radius:2px;box-shadow:0 0 0 9999px rgba(27,28,24,.42)}
html.lg .cwin.cwin .trybtn{border-radius:2px;border:1px dashed var(--lg-rule2);color:var(--lg-ink2);background:transparent}
html.lg .cwin.cwin .locknote{border-radius:2px;background:var(--lg-amber-soft);color:var(--lg-amber)}
html.lg .cwin.cwin .trayicon{border-radius:2px;color:var(--lg-moss2)}

/* ---------- calls: a call sheet in the window's own colours, not a dark room ---------- */
html.lg .cwin.cwin .callv{background:var(--lg-paper);color:var(--lg-ink)}
html.lg .cwin.cwin .callv .lgch{height:56px;display:flex;align-items:center;gap:12px;padding:0 12px 0 20px;background:var(--lg-sheet);border-bottom:1px solid var(--lg-rule2);flex:none}
html.lg .cwin.cwin .callv .lgch .ttl{font:600 17px/1.2 var(--lg-serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.lg .cwin.cwin .callv .lgch .meta{font:500 10.5px/1 var(--lg-mono);color:var(--lg-ink2);letter-spacing:.06em;text-transform:uppercase;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
html.lg .cwin.cwin .callv .lgrec{display:inline-flex;align-items:center;gap:6px;font:600 10px/1 var(--lg-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--lg-rust);border:1px solid var(--lg-rust);border-radius:2px;padding:4px 7px}
html.lg .cwin.cwin .callv .lgrec::before{content:"";width:7px;height:7px;background:var(--lg-rust);border-radius:1px;animation:lgblink 1.2s steps(2) infinite}
@keyframes lgblink{to{opacity:.25}}
html.lg .cwin.cwin .callv .lgsig{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
html.lg .cwin.cwin .callv .lgsig i{display:block;width:3px;background:var(--p-on);border-radius:1px}
html.lg .cwin.cwin .callv .lgbody{flex:1;display:flex;min-height:0;position:relative}
html.lg .cwin.cwin .callv .lgstage{flex:1;display:grid;gap:10px;padding:16px;min-height:0;min-width:0}
html.lg .cwin.cwin .callv .lgcard{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;padding:12px 14px;border:1px solid var(--lg-rule2);border-radius:2px;background:var(--lg-sheet);overflow:hidden}
html.lg .cwin.cwin .callv .lgcard.spk{border-color:var(--lg-moss);box-shadow:inset 0 0 0 1px var(--lg-moss)}
html.lg .cwin.cwin .callv .lgplate{flex:1;display:grid;place-items:center;min-height:0}
html.lg .cwin.cwin .callv .lgwho{display:flex;align-items:flex-end;gap:10px;flex:none}
html.lg .cwin.cwin .callv .lgname{font:600 15px/1.2 var(--lg-serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.lg .cwin.cwin .callv .lgstate{font:500 10px/1 var(--lg-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--lg-ink2);margin-top:4px;display:flex;gap:6px;align-items:center;white-space:nowrap}
html.lg .cwin.cwin .callv .lgstate.mute{color:var(--lg-rust)}
html.lg .cwin.cwin .callv .lgstate.spk{color:var(--lg-moss)}
html.lg .cwin.cwin .callv .lgtag{position:absolute;top:10px;left:12px;font:500 10px/1 var(--lg-mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:2px;padding:3px 6px}
html.lg .cwin.cwin .callv .lglevel{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
html.lg .cwin.cwin .callv .lglevel i{display:block;width:3px;height:4px;background:var(--lg-moss);border-radius:1px;animation:lglev .8s ease-in-out infinite alternate}
html.lg .cwin.cwin .callv .lglevel i:nth-child(2){animation-delay:.12s} html.lg .cwin.cwin .callv .lglevel i:nth-child(3){animation-delay:.24s} html.lg .cwin.cwin .callv .lglevel i:nth-child(4){animation-delay:.36s} html.lg .cwin.cwin .callv .lglevel i:nth-child(5){animation-delay:.48s}
@keyframes lglev{from{height:3px}to{height:12px}}
html.lg .cwin.cwin .callv .lgshare{position:relative;min-height:0;border:1px solid var(--lg-rule2);border-left:4px solid var(--lg-moss);border-radius:2px;background:var(--lg-sheet);padding:18px 22px;overflow:auto;display:flex;flex-direction:column;gap:12px}
html.lg .cwin.cwin .callv .lgsharetag{font:600 10px/1 var(--lg-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lg-moss)}
html.lg .cwin.cwin .callv .lgshare h3{margin:0;font:600 19px/1.2 var(--lg-serif)}
html.lg .cwin.cwin .callv .lgshare .kv{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;font-size:13px;margin-top:4px}
html.lg .cwin.cwin .callv .lgshare .kv span:nth-child(odd){font:600 9.5px/1.9 var(--lg-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--lg-ink3)}
html.lg .cwin.cwin .callv .lgstack{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
html.lg .cwin.cwin .callv .lgstack .lgcard{flex:none;height:110px}
html.lg .cwin.cwin .callv .lgrow2{display:flex;gap:10px;min-height:0;overflow-x:auto}
html.lg .cwin.cwin .callv .lgrow2 .lgcard{width:200px;flex:none}
html.lg .cwin.cwin .callv .lgside{width:280px;flex:none;border-left:1px solid var(--lg-rule2);background:var(--lg-sheet);display:flex;flex-direction:column;overflow:auto}
html.lg .cwin.cwin .callv .lgside .sect{padding:14px 16px 6px}
html.lg .cwin.cwin .callv .lgrow{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--lg-rule);font-size:13px}
html.lg .cwin.cwin .callv .lgrow > span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html.lg .cwin.cwin .callv .lgrow small{font:500 10px/1 var(--lg-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--lg-ink3)}
html.lg .cwin.cwin .callv .lgrow small.mute{color:var(--lg-rust)}
html.lg .cwin.cwin .callv .cadd{width:calc(100% - 32px);margin:12px 16px 4px;height:30px;box-sizing:border-box;border:0;border-bottom:1px solid var(--lg-rule2);border-radius:0;background:transparent;color:var(--lg-ink);font:400 13px/1 var(--lg-sans);padding:0 2px}
html.lg .cwin.cwin .callv .cadd::placeholder{color:var(--lg-ink3);font-style:italic;font-family:var(--lg-serif)}
html.lg .cwin.cwin .callv .cadd:focus{outline:0;border-bottom-color:var(--lg-ink)}
html.lg .cwin.cwin .callv .lgctl{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--lg-rule2);background:var(--lg-sheet);flex:none;flex-wrap:wrap}
html.lg .cwin.cwin .lgcb{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border:1px solid var(--lg-rule2);border-radius:4px;background:var(--lg-sheet);color:var(--lg-ink);font:600 12.5px/1 var(--lg-sans);white-space:nowrap}
html.lg .cwin.cwin .lgcb:hover{background:var(--lg-hover);border-color:var(--lg-ink3)}
html.lg .cwin.cwin .lgcb.on{background:var(--lg-moss);border-color:var(--lg-moss);color:#fff}
html.lg .cwin.cwin .lgcb.end{margin-left:auto;background:var(--lg-rust);border-color:var(--lg-rust);color:#fff;font-weight:600}
html.lg .cwin.cwin .lgcb.end:hover{filter:brightness(.92)}
html.lg .cwin.cwin .callv .lgring{flex:1;display:grid;place-items:center;text-align:center;padding:24px}
html.lg .cwin.cwin .callv .lgring .ttl{font:600 22px/1.2 var(--lg-serif);margin-top:16px}
html.lg .cwin.cwin .callv .lgring .meta{font:500 11px/1 var(--lg-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--lg-ink2);margin-top:8px}
html.lg .cwin.cwin .callv .lgring .lgctl{border:0;background:transparent;justify-content:center;margin-top:24px}
html.lg .cwin.cwin .callv .lgring .lgcb.end{margin-left:0}
html.lg .cwin.cwin .mini{position:absolute;right:16px;bottom:16px;width:280px;border:1px solid var(--lg-rule2);border-radius:2px;background:var(--lg-sheet);color:var(--lg-ink);box-shadow:var(--lg-shadow);z-index:25;overflow:hidden}
html.lg .cwin.cwin .mini .lgminihd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--lg-rule)}
html.lg .cwin.cwin .mini .lgminihd b{font:600 14px/1.2 var(--lg-serif);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.lg .cwin.cwin .mini .lgminihd small{font:500 10.5px/1 var(--lg-mono);color:var(--lg-ink2);letter-spacing:.04em}
html.lg .cwin.cwin .mini .lgminibar{display:flex;gap:6px;padding:8px 10px}
html.lg .cwin.cwin .mini .lgcb{height:30px;padding:0 10px} html.lg .cwin.cwin .mini .lgcb.back{flex:1;justify-content:center} html.lg .cwin.cwin .mini .lgcb.end{margin-left:0}
html.lg .cwin.cwin.m .callv .lgside{position:absolute;right:0;top:0;bottom:0;width:min(280px,86%);z-index:2;box-shadow:var(--lg-shadow)}
html.lg .cwin.cwin.m .callv .lgctl{padding:10px 12px;gap:6px}
html.lg .cwin.cwin.m .callv .lgctl .lgcb{padding:0 10px} html.lg .cwin.cwin.m .callv .lgctl .lgcb:not(.end) span{display:none}
